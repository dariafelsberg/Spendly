<!-- Supabase → Authentication → Emails → Templates → "Confirm signup"
     Betreff (Subject): Welcome to Spendly – please confirm your email -->
<div lang="en" style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #222;">
  <h2 style="color: #e91e63;">Welcome to Spendly 💸</h2>
  <p>Hi {{ .Data.username }},</p>
  <p>great to have you! Please confirm your email address so you can log in:</p>
  <p style="margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #e91e63; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold;">
      Confirm email
    </a>
  </p>
  <p style="font-size: 13px; color: #666;">If you did not sign up for Spendly, you can ignore this email.</p>
  <p>Your Spendly team</p>
</div>
