<!-- Supabase → Authentication → Emails → Security → "Password changed"
     Betreff (Subject): Spendly – your password has been changed -->
<div lang="en" style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #222;">
  <h2 style="color: #e91e63;">Password changed</h2>
  <p>Hi {{ .Data.username }},</p>
  <p>the password of your Spendly account ({{ .Email }}) was just changed.</p>
  <p>If this was you, there is nothing else to do.</p>
  <p>Not you? Reset your password right away:</p>
  <p style="margin: 28px 0;">
    <a href="https://app.spendly.ch/login.html?reset=1"
       style="background: #e91e63; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold;">
      Reset password
    </a>
  </p>
  <p>Your Spendly team</p>
</div>
