<!-- Supabase → Authentication → Emails → Templates → "Reset Password"
     Betreff (Subject): Spendly – reset your password -->
<div lang="en" style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #222;">
  <h2 style="color: #e91e63;">Reset your password</h2>
  <p>Hi {{ .Data.username }},</p>
  <p>you asked to reset your Spendly password. Click the button to choose a new one:</p>
  <p style="margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #e91e63; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold;">
      Choose new password
    </a>
  </p>
  <p style="font-size: 13px; color: #666;">The link is valid for 1 hour. If you did not request this, you can ignore this email. Your password stays the same.</p>
  <p>Your Spendly team</p>
</div>
