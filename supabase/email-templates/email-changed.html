<!-- Supabase → Authentication → Emails → Security → "Email address changed"
     Betreff: Spendly – Deine E-Mail-Adresse wurde geändert -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #222;">
  <h2 style="color: #e91e63;">E-Mail-Adresse geändert</h2>
  <p>Hallo {{ .Data.username }},</p>
  <p>die E-Mail-Adresse deines Spendly-Kontos wurde von {{ .OldEmail }} zu {{ .Email }} geändert.</p>
  <p>Wenn du das warst, musst du nichts weiter tun.</p>
  <p>Warst du das nicht? Setze dein Passwort sofort zurück:</p>
  <p style="margin: 28px 0;">
    <a href="https://app.spendly.ch/login.html?reset=1"
       style="background: #e91e63; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold;">
      Passwort zurücksetzen
    </a>
  </p>
  <p>Dein Spendly-Team</p>
</div>
