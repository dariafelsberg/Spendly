<!-- Supabase → Authentication → Emails → Templates → "Change Email Address"
     Betreff: Spendly – neue E-Mail-Adresse bestätigen -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #222;">
  <h2 style="color: #e91e63;">Neue E-Mail-Adresse bestätigen</h2>
  <p>Hallo {{ .Data.username }},</p>
  <p>bitte bestätige, dass deine Spendly-Adresse von {{ .Email }} zu {{ .NewEmail }} geändert werden soll:</p>
  <p style="margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="background: #e91e63; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold;">
      Änderung bestätigen
    </a>
  </p>
  <p style="font-size: 13px; color: #666;">Falls du das nicht warst, ignoriere diese E-Mail.</p>
  <p>Dein Spendly-Team</p>
</div>
