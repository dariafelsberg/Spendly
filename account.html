<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script>requireLogin();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e91e63">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spendly">
  <link rel="icon" type="image/vnd.microsoft.icon" href="assets/icons/favicon/spendly_favicon_48.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="assets/icons/spendly_apple_touch_icon_180.png" sizes="180x180">
  <title>Account bearbeiten - Spendly</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/settings.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="page-settings">

<div class="app-shell">

  <div class="settings-topbar">
    <h1 class="settings-title">Account bearbeiten</h1>
  </div>

  <main class="account-main">
    <a class="account-back" href="javascript:history.length > 1 ? history.back() : location.assign('index.html')"><span class="ico ico-arrow-left"></span> Zurück</a>

    <div class="profile-avatar" id="profileAvatar" aria-hidden="true"></div>
    <div class="profile-fields">
      <label class="profile-field">
        <span class="profile-field-label">Benutzername</span>
        <input class="profile-field-input" type="text" id="profileUsername" autocomplete="username" minlength="3" oninput="updateProfileAvatar()">
      </label>
      <label class="profile-field">
        <span class="profile-field-label">E-Mail</span>
        <input class="profile-field-input" type="email" id="profileEmail" readonly tabindex="-1">
      </label>
    </div>
    <div class="auth-error" id="profileError"></div>
    <button class="auth-edit-btn" onclick="openPasswordModal()">Passwort ändern<span class="ico ico-arrow-right" aria-hidden="true"></span></button>
    <button class="btn-save profile-save" id="profileSaveBtn" onclick="saveProfile()">Speichern</button>
    <button class="auth-delete-btn" onclick="openDeleteAccountModal()">Konto löschen</button>
  </main>

</div><!-- /app-shell -->

<!-- ══ MODAL: PASSWORT ÄNDERN ══ -->
<div class="modal-overlay" id="passwordModal" onclick="if(event.target===this) closePasswordModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle" tabindex="-1">
    <div class="modal-handle"></div>
    <div class="modal-title" id="passwordModalTitle">Passwort ändern</div>
    <div class="form-group">
      <label class="form-label" for="pwCurrent">Aktuelles Passwort</label>
      <div class="password-wrap">
        <input class="form-input" type="password" id="pwCurrent" autocomplete="current-password">
        <button type="button" class="pw-toggle" onclick="togglePw('pwCurrent', this)" aria-label="Passwort anzeigen"><span class="ico ico-eye_open"></span></button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="pwNew">Neues Passwort</label>
      <div class="password-wrap">
        <input class="form-input" type="password" id="pwNew" autocomplete="new-password" minlength="8" oninput="showPwStrength('pwNew', 'pwNewStrength')">
        <button type="button" class="pw-toggle" onclick="togglePw('pwNew', this)" aria-label="Passwort anzeigen"><span class="ico ico-eye_open"></span></button>
      </div>
      <div class="pw-strength" id="pwNewStrength"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="pwNewConfirm">Neues Passwort bestätigen</label>
      <div class="password-wrap">
        <input class="form-input" type="password" id="pwNewConfirm" autocomplete="new-password" minlength="8">
        <button type="button" class="pw-toggle" onclick="togglePw('pwNewConfirm', this)" aria-label="Passwort anzeigen"><span class="ico ico-eye_open"></span></button>
      </div>
    </div>
    <div class="auth-error" id="passwordError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePasswordModal()">Abbrechen</button>
      <button class="btn-save" id="passwordSaveBtn" onclick="savePassword()">Speichern</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: SPENDLY-KONTO LÖSCHEN ══ -->
<div class="modal-overlay" id="deleteAccountModal" onclick="if(event.target===this) closeDeleteAccountModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteAccountModalTitle" tabindex="-1">
    <div class="modal-handle"></div>
    <div class="modal-title" id="deleteAccountModalTitle">Konto löschen</div>
    <div class="modal-sub">Dein Spendly-Konto und alle deine Daten werden endgültig gelöscht. Das kann nicht rückgängig gemacht werden.</div>
    <div class="form-group">
      <label class="form-label" for="deleteAccountInput">Tippe «LÖSCHEN» zur Bestätigung</label>
      <input class="form-input" type="text" id="deleteAccountInput" autocomplete="off" autocapitalize="characters" oninput="updateDeleteAccountBtn()">
    </div>
    <div class="auth-error" id="deleteAccountError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDeleteAccountModal()">Abbrechen</button>
      <button class="btn-save btn-danger" id="deleteAccountBtn" onclick="confirmDeleteAccount()" disabled>Endgültig löschen</button>
    </div>
  </div>
</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
