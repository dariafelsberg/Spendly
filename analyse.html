<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <script>
  fetch('/api/verify.php', { credentials: 'include' })
    .then(r => r.json())
    .then(d => { if (!d.success) window.location.replace('login.html'); })
    .catch(() => window.location.replace('login.html'));
  </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e91e63">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spendly">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Budget Tracker – Analyse</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="app-shell">

    <!-- ── SETTINGS-STYLE TOPBAR ── -->
    <div class="settings-topbar">
      <h1 class="settings-title">Analyse</h1>
      <button class="icon-btn menu-toggle-btn" onclick="toggleAppMenu()" aria-label="Menü öffnen">⚙️</button>
    </div>

    <!-- ── MAIN: ANALYSE ── -->
    <div class="calendar-main" id="analysisView">

      <!-- Month navigation -->
      <div class="card calendar-nav">
        <button class="cal-nav-btn" onclick="changeInsightsMonth(-1)">‹</button>
        <div class="cal-month-label" id="insightsMonthLabel">—</div>
        <button class="cal-nav-btn" id="insightsNavNext" onclick="changeInsightsMonth(1)">›</button>
      </div>

      <div class="card insights-chart-card">
        <div class="section-label">Monatsbilanz</div>
        <div class="insights-chart" id="insightsChart"></div>
      </div>

      <!-- Einträge des ausgewählten Monats -->
      <div class="card transactions-section">
        <div class="tx-header-left">
          <span class="tx-title">Einträge</span>
          <span class="tx-count" id="insightsTxCount">0</span>
        </div>
        <div class="tx-list open" id="insightsTxList">
          <div class="empty-tx" id="insightsTxEmpty" style="display: none;">Keine Einträge in diesem Monat.</div>
        </div>
      </div>

    </div><!-- /analysisView -->

    <!-- ── APP MENU OVERLAY ── -->
    <div class="app-menu-overlay" id="appMenuOverlay" onclick="if(event.target===this) closeAppMenu()">
      <div class="app-menu-panel">
        <div class="app-menu-header">
          <button class="icon-btn app-menu-close-btn" onclick="closeAppMenu()" aria-label="Menü schliessen">✕</button>
          <div class="app-menu-title">Einstellungen</div>
        </div>
        <div class="app-menu-quicklinks">
          <a class="app-menu-quicklink" href="index.html">🏠 Home</a>
          <a class="app-menu-quicklink" href="calendar.html">📅 Kalender</a>
          <a class="app-menu-quicklink" href="analyse.html">📊 Analyse</a>
        </div>
        <iframe class="app-menu-settings-frame" src="settings.html?embed=1" title="Einstellungen"></iframe>
      </div>
    </div>

    <!-- ── BOTTOM NAV ── -->
    <nav class="bottom-nav">
      <a class="nav-btn" href="index.html">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-btn active" href="calendar.html">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Einblicke</span>
      </a>
      <button class="nav-btn" onclick="toggleAppMenu()">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Einstellungen</span>
      </button>
    </nav>

  </div><!-- /app-shell -->

  <script src="script.js"></script>
</body>

</html>
