<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script>requireLogin(); document.documentElement.classList.add('is-loading');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e91e63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spendly">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>Budget Tracker – Home</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/index.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="app-shell">

    <!-- ── TOPBAR ── -->
    <div class="topbar">
      <button class="icon-btn menu-toggle-btn" onclick="toggleAppMenu()" aria-label="Menü öffnen"><span class="ico ico-settings"></span></button>
      <div class="topbar-inner">
        <div class="topbar-label">Gesamtguthaben</div>
        <div class="total-balance">
          <span class="currency">CHF </span><span id="totalBalanceDisplay">0.00</span><button class="balance-eye" id="balanceEye" onclick="toggleBalanceHidden()" aria-label="Guthaben verbergen"><span class="ico ico-eye_open"></span></button>
        </div>
      </div>
      
      <div class="topbar-inner-accounts">
        <div class="account-pills" id="accountPills"></div>
        <div class="sk-pills" aria-hidden="true"><span class="sk sk-pill"></span><span class="sk sk-pill"></span></div>
      </div>

    </div>

    <!-- ── MAIN ── -->
    <div class="main">

      <div class="month-label" id="monthLabel"></div>

      <!-- Budget card -->
      <div class="card budget-section">
        <div class="budget-icon"><span class="ico ico-wallet"></span></div>
        <div class="budget-info">
          <div class="section-label">Monatsbudget</div>
          <div class="budget-amount" id="budgetDisplay">CHF 0.00</div>
          <div class="budget-sub" id="budgetSub">Noch kein Budget gesetzt</div>
        </div>
      </div>

      <!-- Donut chart -->
      <div class="card donut-wrapper">
        <div class="donut-container">
          <svg id="donutSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="72" fill="none" stroke="#f0e8f0" stroke-width="28" />
            <g id="donutArcs"></g>
          </svg>
          <div class="donut-center">
            <div class="donut-center-budget" id="donutBudget">CHF 0</div>
            <div class="donut-center-spent" id="donutSpent">−CHF 0</div>
            <div class="donut-center-label">Ausgaben</div>
          </div>
          <div class="donut-labels" id="donutLabels"></div>
        </div>
        <div class="categories-grid" id="categoriesGrid"></div>
        <div class="sk-chips" aria-hidden="true"><span class="sk sk-chip"></span><span class="sk sk-chip"></span><span class="sk sk-chip"></span><span class="sk sk-chip"></span><span class="sk sk-chip"></span><span class="sk sk-chip"></span></div>
      </div>

      <!-- Transactions -->
      <div class="card transactions-section">
        <div class="tx-header" onclick="toggleTxList()" id="txHeader">
          <div class="tx-header-left">
            <span class="tx-title">Einträge</span>
            <span class="tx-count" id="txCount">0</span>
          </div>
          <span class="tx-chevron ico ico-arrow-down" id="txChevron"></span>
        </div>
        <div class="tx-list collapsible" id="txList">
          <div class="tx-list-inner" id="txListInner">
            <div class="empty-tx" id="txEmpty">Noch keine Einträge vorhanden.</div>
          </div>
        </div>
      </div>

    </div><!-- /main -->

    <!-- ── FAB ── -->
    <button class="fab" onclick="openEntryModal()">
      <span class="fab-icon">＋</span>
      <span class="fab-label">Eintrag hinzufügen</span>
    </button>

    <!-- ── APP MENU OVERLAY ── -->
    <div class="app-menu-overlay" id="appMenuOverlay" onclick="if(event.target===this) closeAppMenu()">
      <div class="app-menu-panel">
        <div class="app-menu-header">
          <button class="icon-btn app-menu-close-btn" onclick="closeAppMenu()" aria-label="Menü schliessen"><span class="ico ico-close"></span></button>
          <div class="app-menu-title">Einstellungen</div>
        </div>
        <iframe class="app-menu-settings-frame" src="settings.html?embed=1" title="Einstellungen"></iframe>
      </div>
    </div>

    <!-- ── BOTTOM NAV ── -->
    <nav class="bottom-nav">
      <a class="nav-btn active" href="index.html">
        <span class="nav-icon"><span class="ico ico-home"></span></span>
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-btn" href="calendar.html">
        <span class="nav-icon"><span class="ico ico-calendar"></span></span>
        <span class="nav-label">Kalender</span>
      </a>
      <a class="nav-btn" href="analyse.html">
        <span class="nav-icon"><span class="ico ico-combo-chart"></span></span>
        <span class="nav-label">Analyse</span>
      </a>
    </nav>

  </div><!-- /app-shell -->


  <!-- ══ MODAL: EINTRAG ══ -->
  <div class="modal-overlay" id="entryModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="entryModalTitle">Eintrag hinzufügen</div>
      <div class="type-toggle" id="typeToggle">
        <button class="type-btn expense active" id="typeBtnExpense" onclick="setEntryType('expense')"><span class="ico ico-shoppingcart"></span> Ausgabe</button>
        <button class="type-btn income" id="typeBtnIncome" onclick="setEntryType('income')"><span class="ico ico-coin"></span> Einnahme</button>
        <button class="type-btn transfer" id="typeBtnTransfer" onclick="trySetTransferType()"><span class="ico ico-transfer"></span> Überweisung</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Betrag (CHF)</label>
          <input class="form-input" type="text" inputmode="decimal" id="entryAmount" placeholder="0.00" autocomplete="off">
        </div>
        <div class="form-group" id="entryCategoryGroup">
          <label class="form-label">Kategorie</label>
          <select class="form-input form-select" id="entryCategory"></select>
        </div>
      </div>
      <div class="form-group" id="accountSelectGroup">
        <label class="form-label">Konto (optional)</label>
        <select class="form-input form-select" id="entryAccount">
          <option value="">Kein Konto</option>
        </select>
      </div>
      <div class="form-row" id="transferAccountsGroup" style="display:none;">
        <div class="form-group">
          <label class="form-label">Von Konto</label>
          <select class="form-input form-select" id="entryFromAccount"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Auf Konto</label>
          <select class="form-input form-select" id="entryToAccount"></select>
        </div>
      </div>
      <div class="form-group toggle-row account-only-row" id="accountOnlyGroup" style="display:none;">
        <div>
          <div class="toggle-label">Nur Konto</div>
          <div class="toggle-sub">Nicht vom Budget abziehen</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="accountOnlyCheck">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Notiz (optional)</label>
        <input class="form-input" type="text" id="entryNote" placeholder="z.B. Migros Wocheneinkauf">
      </div>
      <div class="form-group">
        <label class="form-label">Datum</label>
        <input class="form-input" type="date" id="entryDate">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEntryModal()">Abbrechen</button>
        <button class="btn-save" onclick="saveEntry()">Speichern</button>
      </div>
    </div>
  </div>

  <!-- ══ MODAL: BUDGET ══ -->
  <div class="modal-overlay" id="budgetModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Monatsbudget</div>
      <div class="modal-sub">Wird jeden Monat automatisch übernommen</div>
      <div class="form-group">
        <label class="form-label">Budget (CHF)</label>
        <input class="form-input" type="text" inputmode="decimal" id="budgetInput" placeholder="z.B. 3000" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeBudgetModal()">Abbrechen</button>
        <button class="btn-save" onclick="saveBudget()">Speichern</button>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages/index.js"></script>
</body>

</html>
